/* ---------- Assistant : ancres, opérations, aperçu, journal ----------
   Toute modification (assistant, check-in, imprévu, rattrapage) passe par la même chaîne :
   opérations → validation (règles + ancres) → aperçu avant/après → « Appliquer » → journal. */
const MOBILE_KINDS=["deep","revision","pomodoro","fiche","nap","bilan","care","lecture","autre"];
const KIND_FROM_TYPE={deep:"deep","travail profond":"deep",travail:"deep",profond:"deep",revision:"revision","révision":"revision",pomodoro:"pomodoro",fiche:"fiche",lecture:"lecture",sieste:"nap",nap:"nap",bilan:"bilan",soin:"care",care:"care",autre:"autre"};
const CAT_OF={deep:"taf",revision:"taf",pomodoro:"taf",fiche:"taf",bilan:"taf",lecture:"perso",nap:"perso",care:"perso",autre:"neutral",service:"taf"};
const LABEL_OF={deep:"Travail profond",revision:"Révision active",pomodoro:"Un Pomodoro",fiche:"Fiches de CM",lecture:"Lecture perso",nap:"Sieste de 20 min",bilan:"Bilan",care:"Soin des pieds",autre:"Bloc"};
const LINKED={"p-lecture":"p-lecture","p-pieds":"p-pieds-dim","p-sieste":"p-sieste","p-revlight":"t-lecons","p-reveil":"p-lit"};
function isMobileItem(i){return !i.anchor&&(MOBILE_KINDS.includes(i.kind)||i.key==="p-lecture")}
function guessKind(t){t=String(t||"").toLowerCase();if(/profond/.test(t))return "deep";if(/r[ée]vis/.test(t))return "revision";if(/pomodoro/.test(t))return "pomodoro";if(/sieste/.test(t))return "nap";if(/lecture|lire/.test(t))return "lecture";if(/fiche/.test(t))return "fiche";return "autre"}
function findTask(id){for(const b of BLOCKS){const t=(S.settings.tasks[b.id]||[]).find(x=>x.id===id);if(t)return t}return null}
function dayFlags(k){const d=S.days[k];return (d&&d.flags)||{}}
function thresholdOf(k){return dayFlags(k).seuil||S.settings.threshold}
function fmtH(h){const m=Math.round(h*60);return Math.floor(m/60)+" h"+(m%60?" "+pad(m%60):"")}

/* Journal (gardé sur cet appareil) */
const LS_JOURNAL="carnet-ronde-journal";
let journal=[];try{journal=JSON.parse(localStorage.getItem(LS_JOURNAL)||"[]")||[]}catch(e){journal=[]}
function saveJournal(){try{localStorage.setItem(LS_JOURNAL,JSON.stringify(journal.slice(-20)))}catch(e){}}
function snapshot(keys,withDl){const snap={days:{}};keys.forEach(k=>{snap.days[k]=S.days[k]?clone(S.days[k]):null});if(withDl)snap.deadlines=clone(S.settings.deadlines||[]);return snap}
function record(label,snap,src){journal.push({id:"j"+Date.now().toString(36),at:Date.now(),label,src:src||"agenda",snap});if(journal.length>20)journal=journal.slice(-20);saveJournal()}
function undoLast(){
  const e=journal.pop();if(!e){toast("Rien à annuler");return}
  for(const k in e.snap.days){const v=e.snap.days[k];S.days[k]=v?v:emptyDay(k);touchDay(k)}
  if(e.snap.deadlines){S.settings.deadlines=e.snap.deadlines;touchSettings()}
  saveJournal();render();toast("Annulé : "+e.label);
}
function mutateDay(k,label,fn){const snap=snapshot([k]);const d=dayOf(k);if(!d.extra)d.extra=[];fn(d);touchDay(k);record(label,snap,"agenda")}

/* Simulation sur une copie */
function dayIn(st,k){if(!st.days[k])st.days[k]=S.days[k]?clone(S.days[k]):emptyDay(k);const d=st.days[k];if(!d.plan)d.plan={};if(!d.extra)d.extra=[];if(!d.checks)d.checks={};if(!d.fields)d.fields={};return d}
function planWith(st,k){
  const keys=Object.keys(st.days),saved={};keys.forEach(x=>{saved[x]=S.days[x];S.days[x]=st.days[x]});
  const sdl=S.settings.deadlines;if(st.deadlines)S.settings.deadlines=st.deadlines;
  try{return buildPlan(k)}finally{keys.forEach(x=>{if(saved[x]===undefined)delete S.days[x];else S.days[x]=saved[x]});S.settings.deadlines=sdl}
}
function normOp(o){
  if(!o||typeof o!=="object")return null;
  const op=String(o.op||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
  const map={ajouter:"add",add:"add",deplacer:"move",move:"move",decaler:"move",raccourcir:"shorten",shorten:"shorten",duree:"shorten",supprimer:"del",retirer:"del",delete:"del",cocher:"check",valider:"check",check:"check",echeance:"deadline",creer_echeance:"deadline",deadline:"deadline",repondre:"reply",reply:"reply"};
  const t=map[op];if(!t)return {t:"unknown",raw:o};
  return fillOp({t,jour:o.jour||o.day,id:o.id!=null?String(o.id):"",debut:o.debut||o.heure||"",duree:o.duree!=null?Math.round(+o.duree):null,titre:String(o.titre||o.title||"").slice(0,120),type:String(o.type||"").toLowerCase(),date:o.date||(t==="deadline"?o.jour:"")||"",texte:String(o.texte||o.reponse||"")});
}
function fillOp(o){return Object.assign({jour:cur,id:"",debut:"",fin:"",duree:null,titre:"",type:"",date:"",texte:"",sub:""},o,{jour:/^\d{4}-\d{2}-\d{2}$/.test(o.jour||"")?o.jour:cur})}
function validTime(s){return /^\d{1,2}:\d{2}$/.test(String(s||""))&&toMin(s)<24*60}
function describe(o,it){
  const n=it.title,a=it.anchor?"Ancre · ":"";
  if(o.t==="move")return a+"Déplacer « "+n+" » de "+hm(it.start)+" à "+o.debut;
  if(o.t==="shorten")return a+"« "+n+" » : "+durTxt(it.dur)+" → "+durTxt(o.duree);
  if(o.t==="del")return a+(it.kind==="cours"?"Annuler ce jour « "+n+" »":"Retirer « "+n+" » ("+hm(it.start)+")");
  if(o.t==="check")return a+"Valider « "+n+" »";
  return n;
}
function ruleCheck(it,items){
  if(it.start<5*60||it.start+it.dur>24*60)return "En dehors de la journée (05:00–24:00)";
  const others=items.filter(x=>x.anchor&&x.key!==it.key&&x.dur>0&&x.status!=="del"&&x.kind!=="placeholder");
  if(!it.anchor){const a=others.find(x=>overlap(x,it));if(a)return "Chevauche une ancre : "+a.title+" ("+hm(a.start)+"–"+hm(a.start+a.dur)+")"}
  else if(it.kind!=="service"){const a=others.find(x=>x.kind!=="trajet"&&overlap(x,it));if(a)return "Chevauche une autre ancre : "+a.title}
  if(it.kind==="deep"){
    if(it.start+it.dur>21*60+30)return "Pas de travail profond après 21:30";
    const svc=items.find(x=>x.kind==="service"&&x.status!=="del"&&it.start>=x.start+x.dur&&it.start<x.start+x.dur+60);
    if(svc)return "Moins d'une heure après un service : pas de travail profond";
    const tot=items.filter(x=>x.kind==="deep"&&x.status!=="del").reduce((s,x)=>s+x.dur,0);
    if(tot>DEEP_CAP)return "Plus de 4 h de travail profond ce jour-là ("+durTxt(tot)+")";
  }
  return "";
}
function evaluateOps(ops,confirmed){
  const st={days:{},deadlines:null},rows=[],days=new Set(),changed={};
  const mark=(k,key)=>{(changed[k]=changed[k]||new Set()).add(key);days.add(k)};
  ops.forEach((o,idx)=>{
    const row={o,idx,status:"ok",reason:"",desc:"",anchor:false};rows.push(row);
    if(o.t==="unknown"){row.status="rejected";row.reason="Opération inconnue";row.desc=String(JSON.stringify(o.raw)).slice(0,80);return}
    if(o.t==="reply"){row.status="info";row.desc=o.texte;return}
    if(o.t==="deadline"){
      if(!o.titre||!/^\d{4}-\d{2}-\d{2}$/.test(o.date)){row.status="rejected";row.reason="Titre ou date manquant";row.desc="Échéance "+(o.titre||"");return}
      if(!st.deadlines)st.deadlines=clone(S.settings.deadlines||[]);
      const dl={id:"dl-"+Date.now().toString(36)+idx,title:o.titre,date:o.date};if(o.serre)dl.serre=true;
      st.deadlines.push(dl);
      row.desc="Nouvelle échéance : "+o.titre+" · "+fmtShort.format(parseKey(o.date))+(o.serre?" · rétroplanning resserré":"");return;
    }
    const k=o.jour;
    if(k<addDays(cur,-1)||k>addDays(cur,13)){row.status="rejected";row.reason="Jour hors de la période";row.desc=k;return}
    const before=st.days[k]?clone(st.days[k]):undefined;
    const rollback=()=>{if(before)st.days[k]=before;else delete st.days[k]};
    const d=dayIn(st,k);
    const dayLbl=k===cur?"":" · "+dowShort(k)+" "+parseKey(k).getDate();
    if(o.t==="dayset"){
      d.flags=Object.assign({},d.flags||{});if(o.seuil)d.flags.seuil=+o.seuil;if(o.seance)d.flags.seance=o.seance;if(o.assis)d.flags.assis=true;
      if(o.douleur!=null)d.pain=+o.douleur;
      row.desc=[o.douleur!=null?"Douleur aux pieds : "+o.douleur+"/10":"",o.seuil?"Journée validée dès "+o.seuil+"/100":"",o.seance?"Salle : "+o.seance:"",o.assis?"Révisions assises":""].filter(Boolean).join(" · ")+dayLbl;mark(k,"__flags");return;
    }
    if(o.t==="task"){
      if(!o.titre){rollback();row.status="rejected";row.reason="Tâche sans nom";return}
      d.xtasks=(d.xtasks||[]).concat({id:"xt-"+Date.now().toString(36)+idx,label:o.titre,detail:o.sub||"Ajoutée par Jke, pour aujourd'hui",section:"journee",block:o.bloc||"domaine"});
      row.desc="Tâche "+(BLOCKS.find(b=>b.id===(o.bloc||"domaine"))||{name:""}).name+" : "+o.titre+dayLbl;mark(k,"__tasks");return;
    }
    let targetKey=null;
    if(o.t==="add"||o.t==="addanchor"){
      if(!validTime(o.debut)||(o.t==="addanchor"&&!validTime(o.fin))){rollback();row.status="rejected";row.reason="Heure invalide";row.desc="Ajouter « "+(o.titre||"un bloc")+" »";return}
      const kind=o.t==="addanchor"?"service":(KIND_FROM_TYPE[o.type]||guessKind(o.titre));
      const dur=o.t==="addanchor"?toMin(o.fin)-toMin(o.debut):Math.max(5,Math.min(240,o.duree||30));
      if(dur<=0){rollback();row.status="rejected";row.reason="Fin avant le début";row.desc=o.titre;return}
      const key="x-"+Date.now().toString(36)+"-"+idx;
      const title=o.titre||LABEL_OF[kind]||"Bloc";
      d.extra.push({key,start:toMin(o.debut),dur,title,kind,cat:CAT_OF[kind]||"neutral",anchor:o.t==="addanchor",sub:o.sub||(o.t==="addanchor"?"Ajouté ce jour":"")});
      targetKey=key;row.desc=(o.t==="addanchor"?"Nouvelle ancre : ":"Ajouter : ")+title+" · "+hm(toMin(o.debut))+"–"+hm(toMin(o.debut)+dur)+dayLbl;
    }else{
      const plan=planWith(st,k);
      const it=plan.items.find(i=>i.key===o.id);
      const task=!it&&o.t==="check"?findTask(o.id):null;
      if(!it&&!task){rollback();row.status="rejected";row.reason="Bloc introuvable";row.desc=o.id||"?";return}
      if(task){d.checks[o.id]=true;row.desc="Cocher : "+task.label+dayLbl;mark(k,"__checks");return}
      row.anchor=!!it.anchor;row.desc=describe(o,it)+dayLbl;
      if(it.anchor&&!confirmed.has(idx)){rollback();row.status="confirm";row.reason="Ancre : à confirmer";return}
      const ext=d.extra.find(x=>x.key===it.key);
      const P=patch=>{const n=Object.assign({},d.plan[it.key]||{},patch);if(it.anchor)n.ank=1;d.plan[it.key]=n};
      if(o.t==="move"){if(!validTime(o.debut)){rollback();row.status="rejected";row.reason="Heure invalide";return}if(ext)ext.start=toMin(o.debut);else P({t:hm(toMin(o.debut))})}
      else if(o.t==="shorten"){if(!o.duree||o.duree<5){rollback();row.status="rejected";row.reason="Durée manquante";return}const du=Math.min(300,o.duree);if(ext)ext.dur=du;else P({d:du})}
      else if(o.t==="del"){if(ext)d.extra=d.extra.filter(x=>x!==ext);else P({s:"del"})}
      else if(o.t==="check"){P({s:"done"});const lk=LINKED[it.key];if(lk)d.checks[lk]=true}
      if(o.t==="move"||o.t==="shorten")targetKey=it.key;
      mark(k,it.key);
    }
    if(targetKey){
      const after=planWith(st,k);const it=after.items.find(i=>i.key===targetKey);
      const why=it?ruleCheck(it,after.items):"Bloc introuvable après modification";
      if(why){rollback();row.status="rejected";row.reason=why;return}
      mark(k,targetKey);
    }
  });
  const okDays=[...days].filter(k=>st.days[k]).sort();
  return {rows,st,days:okDays,changed};
}

/* Aperçu */
let pending=null;
function openPreview(label,src,ops,opts){
  opts=opts||{};
  pending={label,src,reply:opts.reply||"",ops:ops.map(o=>o.t==="unknown"?o:fillOp(o)),confirmed:new Set(opts.preconf||[]),after:opts.after||null,then:opts.then||null};
  pending.res=evaluateOps(pending.ops,pending.confirmed);
}
function friseHTML(items,hl){
  const A=6*60,B=24*60,R=B-A;
  return `<div class="frise">${items.filter(i=>i.dur>0&&i.status!=="del"&&i.kind!=="placeholder"&&i.start+i.dur>A&&i.start<B).map(i=>{const s=Math.max(A,i.start),e=Math.min(B,i.start+i.dur);const c=["seg",i.cat||"neutral"];if(i.anchor)c.push("anc");if(hl&&hl.has(i.key))c.push("hl");return `<i class="${c.join(" ")}" style="left:${((s-A)/R*100).toFixed(2)}%;width:${Math.max(.7,(e-s)/R*100).toFixed(2)}%"></i>`}).join("")}</div>`;
}
function previewHTML(){
  const p=pending;if(!p)return "";const res=p.res;
  const ok=res.rows.filter(r=>r.status==="ok").length;
  let h=`<div class="card prev" id="apercu"><div class="eyebrow">Aperçu · rien n'est encore appliqué</div><h2>${esc(p.label)}</h2>`;
  if(p.reply)h+=`<p style="margin:0;white-space:pre-wrap">${esc(p.reply)}</p>`;
  for(const k of res.days.slice(0,3)){
    const hl=res.changed[k]||new Set();
    h+=`<div class="frisebox"><span class="small"><b style="text-transform:capitalize">${fmtLong.format(parseKey(k))}</b></span><div class="friserow"><span class="flab">Avant</span>${friseHTML(buildPlan(k).items,null)}</div><div class="friserow"><span class="flab">Après</span>${friseHTML(planWith(res.st,k).items,hl)}</div><div class="frise-ticks"><span>6h</span><span>9h</span><span>12h</span><span>15h</span><span>18h</span><span>21h</span><span>24h</span></div></div>`;
  }
  h+=`<ul class="oplist">`+res.rows.filter(r=>r.status!=="info").map(r=>{
    if(r.anchor){const on=p.confirmed.has(r.idx);return `<li class="op conf"><label><input type="checkbox" data-confirm="${r.idx}" ${on?"checked":""}><span>${ICON.lock.replace("<svg",'<svg class="lk"')} ${esc(r.desc)}</span></label><small>${!on?"Ancre verrouillée : coche pour confirmer ce changement":r.status==="rejected"?"Refusé : "+esc(r.reason):"Confirmé, sera appliqué"}</small></li>`}
    if(r.status==="ok")return `<li class="op ok"><span>✓ ${esc(r.desc)}</span></li>`;
    return `<li class="op ko"><span>✕ ${esc(r.desc)}</span><small>Refusé : ${esc(r.reason)}</small></li>`;
  }).join("")+`</ul>`;
  h+=`<div class="frow"><button class="go" data-prevapply="1" style="margin-left:0" ${ok?"":"disabled"}>Appliquer${ok?" ("+ok+")":""}</button><button class="mini" data-prevcancel="1" style="padding:0 16px">Annuler</button></div></div>`;
  return h;
}
function applyPending(){
  const p=pending;if(!p)return;
  const res=evaluateOps(p.ops,p.confirmed);
  const ok=res.rows.filter(r=>r.status==="ok").length;
  if(!ok){toast("Aucune modification valable à appliquer");return}
  const snap=snapshot(res.days,!!res.st.deadlines);
  for(const k of res.days){S.days[k]=res.st.days[k];touchDay(k)}
  if(res.st.deadlines){S.settings.deadlines=res.st.deadlines;touchSettings()}
  record(p.label,snap,p.src);
  if(p.after)p.after();
  pending=null;render();if(p.then)setTimeout(p.then,60);toast(ok+" modification"+(ok>1?"s":"")+" appliquée"+(ok>1?"s":"")+" · annulable dans le journal");
}
function applyDirect(label,src,ops){
  const o=ops.map(fillOp);const res=evaluateOps(o,new Set());
  const bad=res.rows.find(r=>r.status!=="ok"&&r.status!=="info");
  if(bad){toast(bad.reason||"Modification refusée");return false}
  const snap=snapshot(res.days,!!res.st.deadlines);
  for(const k of res.days){S.days[k]=res.st.days[k];touchDay(k)}
  record(label,snap,src);return true;
}

/* Créneau libre : jamais sur une ancre ni sur un autre bloc, jamais après 21:30 */
function freeSlot(k,dur,from,to,kind){
  // les blocs de remplissage (g-…) se replacent tout seuls autour d'un ajout : ils ne bloquent pas
  const items=buildPlan(k).items.filter(i=>i.dur>0&&i.status!=="del"&&i.kind!=="placeholder"&&!i.key.startsWith("g-"));
  for(let t=Math.ceil(from/5)*5;t+dur<=Math.min(to,21*60+30);t+=5){
    const c={start:t,dur};
    if(items.some(b=>overlap(c,b)))continue;
    if(kind==="deep"&&items.some(s=>s.kind==="service"&&t>=s.start+s.dur&&t<s.start+s.dur+60))continue;
    return t;
  }
  return null;
}

/* Rattrapage : « ne jamais rater deux fois » */
let prioMemo={};
function missedItems(k,limit){
  const d=S.days[k];if(k!==cur&&!(d&&d.updatedAt))return [];
  const checks=(d&&d.checks)||{};
  return buildPlan(k).items.filter(i=>isMobileItem(i)&&i.dur>0&&!["done","del","skip"].includes(i.status)&&!(LINKED[i.key]&&checks[LINKED[i.key]])&&i.start+i.dur<=limit);
}
function missedOn(key,k){if(!prioMemo[k])prioMemo[k]=new Set(missedItems(k,24*60).map(i=>i.key));return prioMemo[k].has(key)}
function highPrio(key,k){return key.startsWith("p-")&&missedOn(key,addDays(k,-1))&&missedOn(key,addDays(k,-2))}
function rattrapageHTML(){
  const n=nowMin();
  const miss=missedItems(cur,n);if(!miss.length)return "";
  const rows=miss.map(i=>{
    const two=missedOn(i.key,addDays(cur,-1));
    let dur=i.dur,at=freeSlot(cur,dur,n,i.kind==="nap"?18*60:21*60+30,i.kind);
    if(at==null&&i.kind==="deep"&&dur>45){dur=45;at=freeSlot(cur,45,n,21*60+30,"deep")}

  }).sort((a,b)=>(b.two-a.two)||(a.i.start-b.i.start));

}

let sampleFn,sampleOff="";
async function getSample(){
  if(STANDALONE||!window.claude||!window.claude.use){sampleFn=null;return null}
  if(sampleFn!==undefined)return sampleFn;
  try{sampleFn=await window.claude.use("sample")}catch(e){sampleFn=null}
  return sampleFn;
}
function sampleReady(){return !STANDALONE&&sampleFn!==null&&!sampleOff}
function sampleOffMsg(){return STANDALONE?"Jke ne comprend la voix que dans la version claude.ai de l'app. Ici, les imprévus, le check-in, le rattrapage et le journal fonctionnent sans réseau.":(sampleOff||"Jke ne peut pas joindre Claude ici. Les imprévus, le check-in, le rattrapage et le journal marchent quand même.")}
function sampleErr(e){
  const c=e&&e.code;
  if(c==="cancelled")return "";
  if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){sampleOff="Claude n'est pas autorisé pour Jke sur cette page. Les imprévus, le check-in, le rattrapage et le journal marchent quand même.";return sampleOff}
  if(c==="rate_limited")return "Trop de demandes pour l'instant. Réessaie dans quelques minutes.";
  if(c==="session_expired")return "Reconnecte-toi à Claude, puis réessaie.";
  if(c==="invalid_json")return "Réponse illisible. Reformule ta demande ou réessaie.";
  if(c==="refused")return "Claude n'a pas pu traiter cette demande. Reformule-la.";
  return "La demande n'a pas abouti (réseau ou service). Réessaie.";
}

let AS={text:"",busy:false,answer:"",err:"",ctl:null,scen:null,svcS:"18:30",svcE:"22:45",debFin:"23:30",ecTitre:"",ecDate:"",maisonUse:"deep",libreDur:60};
async function askAssistant(){
  const box=document.getElementById("as-input");const text=((box&&box.value)||AS.text||"").trim();
  if(!text){toast("Dicte ou écris ta demande");if(box)box.focus();return}
  AS.text=text;
  const sample=await getSample();
  if(!sample||sampleOff){AS.err=sampleOffMsg();render();return}
  AS.busy=true;AS.err="";AS.answer="";pending=null;AS.ctl=new AbortController();render();
  try{
    const r=await sample.json(assistantPrompt(text),{signal:AS.ctl.signal,cache:false});
    const reply=String((r&&(r.reponse||r.réponse||r.reply))||"").trim();
    const raw=Array.isArray(r&&r.operations)?r.operations:[];
    const ops=raw.slice(0,20).map(normOp).filter(Boolean);
    AS.answer=[reply,...ops.filter(o=>o.t==="reply").map(o=>o.texte)].filter(Boolean).join("\n");
    const real=ops.filter(o=>o.t!=="reply");
    if(real.length)openPreview("« "+text.slice(0,60)+(text.length>60?"…":"")+" »","jke",real);
  }catch(e){AS.err=sampleErr(e)}
  finally{AS.busy=false;AS.ctl=null;if(view==="jke"&&pending)go("jke","apercu");else render()}
}

function deepOkAt(k,start,dur){const items=buildPlan(k).items;return start+dur<=21*60+30&&!items.some(x=>x.kind==="service"&&x.status!=="del"&&start>=x.start+x.dur&&start<x.start+x.dur+60)&&deepUsedOn(k)+dur<=DEEP_CAP}

function scenarioOps(sc,arg){

    ops.push({t:"addanchor",debut:hm(s),fin:hm(e),titre:"Service en plus"});
  }

/* Check-in du matin : note de forme */
function formeOf(c){
  const s=Math.max(0,Math.min(1,((+c.sleep||0)-4)/4)),e=((+c.energy||1)-1)/4,p=1-(+c.pain||0)/10;
  const score=Math.round(100*(.4*s+.35*e+.25*p));
  let color=score>=70?"vert":score>=45?"orange":"rouge";
  if((+c.pain||0)>=8||+c.energy===1||(+c.sleep||0)<5)color="rouge";
  return {score,color};
}
function formeLine(c){return `<span class="forme f-${c.color}"><i class="fdot"></i>Forme ${c.color} · ${c.score}/100</span>`}
function checkinHTML(d){
  const c=d.checkin||{};
  const sl=c.sleep!=null?c.sleep:Math.max(3,Math.min(10,Math.round(nightBefore(cur)/30)/2));
  const pain=d.pain!=null?d.pain:(c.pain!=null?c.pain:0);
  let h=`<div class="checkin" id="checkin"><div class="kv"><b>Check-in du matin</b><span class="badge">20 s</span></div>`;
  h+=`<label class="flabel" for="ci-sleep">Sommeil : <span id="ci-sleep-v">${fmtH(sl)}</span></label><input type="range" id="ci-sleep" min="3" max="10" step="0.5" value="${sl}">`;
  h+=`<span class="flabel">Énergie</span><div class="chips" role="group" aria-label="Énergie de 1 à 5">${[1,2,3,4,5].map(x=>`<button class="chip" data-cien="${x}" aria-pressed="${+c.energy===x}" style="min-width:44px">${x}</button>`).join("")}</div>`;
  h+=`<label class="flabel" for="ci-pain">Douleur aux pieds : <span id="ci-pain-v">${pain}</span>/10</label><input type="range" id="ci-pain" min="0" max="10" step="1" value="${pain}">`;
  h+=`<label class="flabel" for="ci-note">Une phrase</label><input type="text" id="ci-note" placeholder="Touche le micro et dis comment tu te sens" value="${esc(c.note||"")}">`;
  if(c.color)h+=`<div>${formeLine(c)}${c.applied?` <span class="small muted">· ajustements appliqués</span>`:""}</div>`;
  h+=`<button class="go" data-cigo="1" style="margin-left:0;align-self:flex-start">${c.color?"Recalculer ma forme":"Calculer ma forme"}</button></div>`;
  return h;
}
function runCheckin(){
  const d=dayOf(cur);const c=Object.assign({},d.checkin||{});
  if(c.sleep==null)c.sleep=Math.max(3,Math.min(10,Math.round(nightBefore(cur)/30)/2));
  if(!c.energy){toast("Choisis ton énergie de 1 à 5");return}
  c.pain=d.pain!=null?d.pain:(c.pain||0);
  Object.assign(c,formeOf(c),{at:Date.now(),applied:false});
  d.checkin=c;touchDay(cur);
  let ops=[];
  if(c.color==="rouge"){
    ops=lightOps({deep45:true,sieste:true,seuil60:true,seance:(+c.energy<=1||c.pain>=8)?"Repos":"Haut du corps"});
  }else if(c.color==="orange"){
    const at=freeSlot(cur,20,Math.max(12*60+30,nowMin()),18*60,"nap");
    if(at!=null)ops.push({t:"add",debut:hm(at),duree:20,titre:"Sieste de 20 min",type:"sieste"});
  }
  if(!ops.length){render();toast(c.color==="vert"?"Forme verte : la journée garde le plan complet":"Forme "+c.color+" : rien à ajuster");return}
  openPreview("Check-in : forme "+c.color+" ("+c.score+"/100)","checkin",ops,{after:()=>{const dd=dayOf(cur);if(dd.checkin){dd.checkin.applied=true;touchDay(cur)}}});
  go("jour","apercu");
}

    if(it.key.startsWith("g-"))ops=[{t:"del",id:it.key},{t:"add",debut:ds.rtt,duree:+ds.rtd,titre:it.title,type:it.kind}];if(applyDirect("Rattrapage : "+it.title+" → "+ds.rtt,"rattrapage",ops)){render();toast("Replacé à "+ds.rtt)}return}
  if(ds.rtdone){const key=ds.rtdone;mutateDay(cur,"Fait : "+itemTitle(cur,key),dd=>{dd.plan[key]=Object.assign({},dd.plan[key]||{},{s:"done"});const lk=LINKED[key];if(lk)dd.checks[lk]=true});render();return}
  if(ds.rtskip){const key=ds.rtskip;mutateDay(cur,"Laissé tomber : "+itemTitle(cur,key),dd=>{dd.plan[key]=Object.assign({},dd.plan[key]||{},{s:"skip"})});render();return}
  // réglages des imprévus
  if(ds.sctog){const sc=S.settings.scenarios.find(x=>x.id===ds.id);if(sc){sc.effets=Object.assign({},sc.effets||{});sc.effets[ds.sctog]=!sc.effets[ds.sctog];touchSettings();render()}return}
  if(ds.scadd){S.settings.scenarios.push({id:"sc-"+Date.now().toString(36),nom:"Nouvel imprévu",type:"leger",texte:"Décris ton plan B",effets:{deep45:true,sieste:false,seuil60:false,seance:"",bloc:"",blocDuree:0}});touchSettings();render();go("reglages","reg-imprevus");return}
  if(ds.scask){confirmSc=ds.scask;render();go("reglages","reg-imprevus");return}
  if(ds.scdel){S.settings.scenarios=S.settings.scenarios.filter(x=>x.id!==ds.scdel);confirmSc=null;touchSettings();render();return}
  if(ds.screset){S.settings.scenarios=defaultScenarios();touchSettings();render();toast("Scénarios par défaut rétablis");return}
  if(ds.agmove!==undefined){moving=ds.agmove||null;render();if(moving){const el=document.getElementById("mv-"+moving);if(el)el.focus()}return}
  if(ds.agset){const key=ds.agset,el=document.getElementById("mv-"+key);if(el&&el.value){mutateDay(agDay,"Déplacé : "+itemTitle(agDay,key)+" → "+el.value,dd=>{if(key.startsWith("x-")){const x=dd.extra.find(z=>z.key===key);if(x)x.start=toMin(el.value)}else dd.plan[key]=Object.assign({},dd.plan[key]||{},{t:el.value})});toast("Déplacé à "+el.value)}moving=null;render();return}
  if(ds.agrestore){mutateDay(ds.agrestore,"Blocs rétablis",d=>{Object.keys(d.plan).forEach(k=>{if(d.plan[k].s==="del"&&!d.plan[k].ank){delete d.plan[k].s;if(!Object.keys(d.plan[k]).length)delete d.plan[k]}})});render();return}
  // échéances
  if(ds.isadd){const el=document.getElementById("is-new");const t=(el&&el.value||"").trim();if(!t){if(el)el.focus();toast("Décris ce qu'il faut signaler");return}S.settings.issues.push({id:"is-"+Date.now().toString(36),text:t.slice(0,300),created:cur,done:""});touchSettings();render();go("jour","signaler");toast("Signalement ajouté");return}
  if(ds.isdone){const x=S.settings.issues.find(i=>i.id===ds.isdone);if(x){x.done=cur;touchSettings();render();go("jour","signaler");toast("Marqué comme réglé")}return}
  if(ds.isundo){const x=S.settings.issues.find(i=>i.id===ds.isundo);if(x){x.done="";touchSettings();render();go("jour","signaler")}return}
  if(ds.dladd){const ti=document.getElementById("dl-title"),da=document.getElementById("dl-date");const title=(ti.value||"").trim();if(!title){ti.focus();toast("Donne un nom à l'échéance");return}S.settings.deadlines.push({id:"dl-"+Date.now().toString(36),title,date:da.value||""});touchSettings();render();go("jour","echeance");toast("Échéance ajoutée");return}
  if(ds.dlask){confirmDl=ds.dlask;render();go("jour","echeance");setTimeout(()=>{if(confirmDl===ds.dlask){confirmDl=null;if(view==="jour"&&!editing())render()}},4000);return}
  if(ds.dldel){S.settings.deadlines=S.settings.deadlines.filter(x=>x.id!==ds.dldel);confirmDl=null;touchSettings();render();return}
  // emploi du temps
  if(ds.icsask){confirmIcs=true;render();return}
  if(ds.icsdel){S.ics=null;confirmIcs=false;Object.keys(occCache).forEach(k=>delete occCache[k]);touchIcs();render();toast("Emploi du temps supprimé");return}
  // réglages
  if(ds.trash){const n=Number(ds.trash);const a=S.settings.trashDays||[];S.settings.trashDays=a.includes(n)?a.filter(x=>x!==n):a.concat(n);touchSettings();render();return}
  if(ds.th){S.settings.threshold=Math.min(100,Math.max(30,S.settings.threshold+Number(ds.th)));touchSettings();render();return}
  if(ds.trav){const v=+S.settings[ds.trav]||0;const step=(v<10||(v===10&&+ds.step<0))?1:5;S.settings[ds.trav]=Math.min(120,Math.max(0,v+step*Number(ds.step)));touchSettings();render();return}
  if(ds.deep){S.settings.deepGoal=Math.min(40,Math.max(1,(+S.settings.deepGoal||12)+Number(ds.deep)));touchSettings();render();return}
  if(ds.fxadd){S.settings.fixed.push({id:"fx-"+Date.now().toString(36),dow:1,s:"09:00",e:"10:00",t:"Nouvel événement",type:"autre"});touchSettings();render();return}
  if(ds.fxask){confirmFx=ds.fxask;render();setTimeout(()=>{if(confirmFx===ds.fxask){confirmFx=null;if(view==="reglages"&&!editing())render()}},4000);return}
  if(ds.fxdel){S.settings.fixed=S.settings.fixed.filter(f=>f.id!==ds.fxdel);confirmFx=null;touchSettings();render();return}
  if(ds.tday){const tk=S.settings.tasks[ds.b][Number(ds.i)];const dn=Number(ds.tday);let a=tk.days?tk.days.slice():[0,1,2,3,4,5,6];a=a.includes(dn)?a.filter(x=>x!==dn):a.concat(dn);if(!a.length){toast("Garde au moins un jour");return}if(a.length===7)delete tk.days;else tk.days=a;touchSettings();render();return}
  if(ds.move){const a=S.settings.tasks[ds.b],i=Number(ds.i),j=i+Number(ds.move);if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];touchSettings();render();return}
  if(ds.askdel){confirmDel=ds.askdel;render();setTimeout(()=>{if(confirmDel===ds.askdel){confirmDel=null;if(view==="reglages"&&!editing())render()}},4000);return}
  if(ds.del){S.settings.tasks[ds.b].splice(Number(ds.i),1);confirmDel=null;touchSettings();render();toast("Tâche supprimée");return}
  if(ds.add){const id="u-"+Date.now().toString(36);S.settings.tasks[ds.add].push({id,label:"Nouvelle tâche",detail:"",section:"journee"});touchSettings();render();const el=document.getElementById("s-l-"+id);if(el){el.focus();el.select()}return}
  if(ds.askreset){confirmReset=true;render();return}
  if(ds.exportcopy){copyExport();return}
  if(ds.exportdl){downloadExport();return}
  if(ds.importopen){importOpen=true;render();go("reglages","sauvegarde");setTimeout(()=>{const b=document.getElementById("import-box");if(b)b.focus()},50);return}
  if(ds.importask){const b=document.getElementById("import-box");const v=b&&b.value;if(!v||!v.trim()){toast("Colle d'abord tes données");return}importConfirm=true;render();go("reglages","sauvegarde");const nb=document.getElementById("import-box");if(nb)nb.value=v;return}
  if(ds.importgo){doImport();return}
  if(ds.reset){S.settings.tasks=clone(DEFAULT_TASKS);confirmReset=false;touchSettings();render();toast("Tâches par défaut rétablies");return}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.field){
    const d=dayOf(cur);d.fields[el.dataset.field]=el.value;
    if(el.dataset.autocheck&&el.value.trim())setCheck(el.dataset.autocheck,true);
    touchDay(cur);return;
  }
  if(el.id==="f-pain"||el.id==="ci-pain"){const d=dayOf(cur);d.pain=Number(el.value);const pv=document.getElementById("pain-v");if(pv)pv.innerHTML=d.pain+'<small class="muted" style="font-size:15px">/10</small>';const pa=document.getElementById("pain-advice");if(pa)pa.innerHTML=painAdvice(d.pain);const cv=document.getElementById("ci-pain-v");if(cv)cv.textContent=d.pain;const o=document.getElementById(el.id==="f-pain"?"ci-pain":"f-pain");if(o)o.value=d.pain;el.setAttribute("aria-valuetext",d.pain+" sur 10");touchDay(cur);return}
  if(el.id==="ci-sleep"){const d=dayOf(cur);d.checkin=Object.assign({},d.checkin||{},{sleep:+el.value});const v=document.getElementById("ci-sleep-v");if(v)v.textContent=fmtH(+el.value);touchDay(cur);return}
  if(el.id==="ci-note"){const d=dayOf(cur);d.checkin=Object.assign({},d.checkin||{},{note:el.value});touchDay(cur);return}
  if(el.dataset.debrief){const d=dayOf(cur);d.debrief=Object.assign({},d.debrief||{},{[el.dataset.debrief]:el.value});touchDay(cur);return}
  if(el.id==="as-input"){AS.text=el.value;return}
  if(el.dataset.scn){const sc=S.settings.scenarios.find(x=>x.id===el.dataset.id);if(sc){const f=el.dataset.scn;if(f==="nom"||f==="texte")sc[f]=el.value;else{sc.effets=Object.assign({},sc.effets||{});sc.effets[f]=f==="blocDuree"?Math.max(0,Math.min(180,+el.value||0)):el.value}touchSettings()}return}
  if(el.id==="q-reves"){dreamQ=el.value;document.getElementById("dream-list").innerHTML=dreamListHTML();return}
  if(el.dataset.adj){S.settings.bilans=S.settings.bilans||{};S.settings.bilans[el.dataset.adj]=el.value;touchSettings();return}
  if(el.dataset.edit&&el.tagName==="INPUT"){const t=S.settings.tasks[el.dataset.b][Number(el.dataset.i)];if(t){t[el.dataset.edit]=el.value;touchSettings()}return}
  if(el.dataset.fx==="t"){const f=S.settings.fixed.find(x=>x.id===el.dataset.id);if(f){f.t=el.value;touchSettings()}return}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.edit==="section"){const t=S.settings.tasks[el.dataset.b][Number(el.dataset.i)];if(t){t.section=el.value;touchSettings()}return}
  if(el.dataset.wake!==undefined&&el.value){S.settings.wake[el.dataset.wake]=el.value;touchSettings();return}
  if(el.id==="set-bed"&&el.value){S.settings.bedWeek=el.value;touchSettings();return}
  if(el.dataset.trashtime!==undefined&&el.value){S.settings.trashTimes=Object.assign({},S.settings.trashTimes,{[el.dataset.trashtime]:el.value});touchSettings();return}
  if(el.id==="set-linge"&&el.value){S.settings.lingeTime=el.value;touchSettings();return}
  if(el.dataset.fx&&el.dataset.fx!=="t"){const f=S.settings.fixed.find(x=>x.id===el.dataset.id);if(f&&el.value!==""){f[el.dataset.fx]=el.dataset.fx==="dow"?Number(el.value):el.value;touchSettings()}return}
  if(el.id==="ics-file"&&el.files&&el.files[0]){importICS(el.files[0]);el.value="";return}
  if(el.dataset.confirm!==undefined&&pending){const i=+el.dataset.confirm;if(el.checked)pending.confirmed.add(i);else pending.confirmed.delete(i);const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(el.dataset.scn==="seance"){const sc=S.settings.scenarios.find(x=>x.id===el.dataset.id);if(sc){sc.effets=Object.assign({},sc.effets||{},{seance:el.value});touchSettings()}return}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&(e.target.id==="dl-title"||e.target.id==="dl-date")){e.preventDefault();const b=document.querySelector("[data-dladd]");if(b)b.click()}
  if(e.key==="Enter"&&e.target.id==="is-new"){e.preventDefault();const b=document.querySelector("[data-isadd]");if(b)b.click()}
});
window.addEventListener("hashchange",()=>{const v=routeFromHash();if(v!==view){view=v;render();window.scrollTo(0,0)}});

/* ---------- Nouveau jour ---------- */
function checkRollover(){
  const k=todayKey();
  if(k!==cur){
    if(S.days[cur]&&S.days[cur].updatedAt)touchDay(cur);
    const wasToday=agDay===cur;
    cur=k;openDay=null;bilanWeek=null;if(wasToday)agDay=cur;
    if(!editing())render();
  }
}
let lastMinute=nowMin();
setInterval(()=>{
  checkRollover();updatePomo();
  const m=nowMin();if(m!==lastMinute){lastMinute=m;if((view==="agenda"||view==="jour")&&!editing()&&!moving&&!unlocking&&document.visibilityState==="visible"){const y=window.scrollY;render();window.scrollTo(0,y)}}
},1000);
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){checkRollover();updatePomo();if(!STANDALONE)sync()}
  else{Object.keys(timers).forEach(id=>{clearTimeout(timers[id]);if(dirty[id])pushDoc(id)})}
});

/* ---------- Démarrage ---------- */
loadLocal();
migrateDeadlines();
migrateIssues();
view=routeFromHash();
render();
initRemote();
getSample().then(()=>{if((view==="jke"||view==="jour")&&!editing()&&!AS.busy)render()});
})();
</script>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(reg=>{
      reg.update().catch(()=>{});
      document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")reg.update().catch(()=>{})});
      reg.addEventListener("updatefound",()=>{
        const w=reg.installing;if(!w)return;
        w.addEventListener("statechange",()=>{
          if(w.state==="installed"&&navigator.serviceWorker.controller){
            const t=document.getElementById("toast");
            if(t){t.textContent="Nouvelle version prête · ferme et rouvre l'app";t.classList.add("show");setTimeout(()=>t.classList.remove("show"),5000)}
          }
        });
      });
    }).catch(()=>{});
  });
}
</script>
